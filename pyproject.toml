[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fear-ladder"
version = "0.1.0"
description = "FearLadder — 공포가 깊을수록 레버리지를 올리되, 추세가 무너지면 멈춘다. 나스닥100 레짐 모니터 (자동매매 없음)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "gardengo" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "finance-datareader>=0.9.90",
    # AAII publishes its weekly survey as a legacy .xls, which pandas can only
    # open through xlrd. Without it scripts/fetch_reference.py fails and the
    # sentiment indicator quietly drops out of the composite score.
    "xlrd>=2.0.1",
    # zoneinfo needs an IANA database; Windows has none of its own.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.63", "plotly>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
]

[project.scripts]
fearladder-daily = "fear_ladder.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fear_ladder = ["data/repositories/*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "network: test requires live network access (deselect with '-m \"not network\"')",
    "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:fear_ladder.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fear_ladder"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["FinanceDataReader.*", "pandas.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true
