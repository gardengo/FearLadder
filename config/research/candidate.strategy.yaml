# candidate.strategy.yaml — after the parameter search (TASK-080..085).
#
# Searched on the RESEARCH window only (1999-01-01 .. 2015-08-14), by coordinate
# descent: trend filter -> transition -> regime -> weights. See scripts/optimize.py.
#
# NOT FROZEN. The out-of-sample window has not been spent, so this has not had
# its final test. scripts/freeze.py is a separate, deliberate act.
#
# HOW WELL EACH PARAMETER IS ACTUALLY SUPPORTED
#
#   trend_filter        STRONG   monotone, and the single largest effect found:
#                                without it the research window returns -2.74%
#                                CAGR at 98.4% drawdown; with it, +9.5% at 58.2%.
#   regime.count = 5    STRONG   marginal objective by count: 3 -0.017,
#                                5 +0.094, 7 +0.075, 9 -0.125.
#   score.weights       MEDIUM   trend-heavy won; fear-heavy came last, which is
#                                consistent with the trend-filter finding.
#   transition.hyst=5   WEAK     a clean interior optimum on the marginal, best
#                                on CAGR and MDD simultaneously.
#   transition c=1,d=75 NONE     noise. The marginal for minimum_duration is
#                                non-monotone (45 +0.024, 60 -0.002, 75 +0.052,
#                                90 -0.003) and sensitivity calls d a SPIKE
#                                (neighbour gap +90%). Chosen structurally:
#                                turnover falls monotonically with duration, so
#                                the longer end is preferred for robustness.
#   regime.boundaries   NONE     noise. Across stretch factors the objective is a
#                                sawtooth (-0.10, +0.31, +0.08, +0.20, +0.30,
#                                +0.13). Round values near even were chosen
#                                rather than either fitted peak.
#
# Over one 16.6-year window, candidate objectives span -0.10..+0.31 while
# neighbourhood means span only +0.04..+0.09. Peak height is roughly ten times
# the real signal, so the peaks are mostly luck. Where that was the case the
# value was set on structural grounds, not by taking the maximum.

version: 1
strategy_version: v0.4-searched
parameter_status: RESEARCH
data_version: fdr+reconstructed-1996
parameter_version: p1-coordinate-descent-2026-09-12
frozen_at: null
score:
  weights:
    rsi_14: 0.05555555555555555
    rsi_30: 0.05555555555555555
    price_vs_20dma: 0.06666666666666667
    price_vs_50dma: 0.06666666666666667
    price_vs_200dma: 0.06666666666666667
    ma_50_200_ratio: 0.06666666666666667
    ma_200_slope: 0.06666666666666667
    momentum_1m: 0.05555555555555555
    momentum_3m: 0.05555555555555555
    momentum_6m: 0.05555555555555555
    momentum_12m: 0.05555555555555555
    drawdown_current: 0.027777777777777776
    drawdown_30d: 0.027777777777777776
    drawdown_90d: 0.027777777777777776
    drawdown_52w: 0.027777777777777776
    vix_level: 0.037037037037037035
    vix_change_5d: 0.037037037037037035
    vix_percentile: 0.037037037037037035
    cnn_fear_greed: 0.05555555555555555
    aaii_bull_bear_spread: 0.05555555555555555
regime:
  count: 5
  labels:
  - Capitulation
  - Fear
  - Neutral
  - Bull
  - Overheated
  boundaries:
  - 25.0
  - 40.0
  - 60.0
  - 75.0
  research_candidates:
