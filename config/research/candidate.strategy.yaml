  hysteresis: 5.0
  minimum_duration_days: 75
  research_candidates:
    confirmation_days:
    - 1
    - 2
    - 3
    - 5
    - 10
    hysteresis:
    - 0
    - 2
    - 5
    - 8
    - 10
    minimum_duration_days:
    - 1
    - 5
    - 10
    - 20
    - 30
    - 45
    - 60
allocation:
  mappings:
    Capitulation:
      TQQQ: 1.0
    Fear:
      TQQQ: 0.375
      QLD: 0.625
    Neutral:
      QLD: 0.75
      QQQ: 0.25
    Bull:
      QLD: 0.125
      QQQ: 0.875
    Overheated:
      QQQ: 0.5
      CASH: 0.5
  constraints:
    weights_non_negative: true
    weights_sum_to_one: true
    min_market_exposure: 0.5
    max_target_leverage: 3.0
tqqq_gate:
  enabled: true
  required_rules:
  - deep_drawdown
  - extreme_fear
  min_confirmations: 4
  candidate_rules:
  - deep_drawdown
  - extreme_fear
  - high_vix
  - oversold_rsi
  - volatility_spike
  - price_stabilization
  - reversal_evidence
  - breadth_capitulation
