# candidate.strategy.yaml — after the parameter search (TASK-080..085).
#
# Searched on the RESEARCH window only (1999-01-01 .. 2015-08-14), by coordinate
# descent: trend filter -> transition -> regime -> weights. See scripts/optimize.py.
#
# PAIRS WITH candidate.indicators.yaml. The indicator normalization was searched
# separately (docs/strategy.md 2.6) and the two are only meaningful together:
#
#   python scripts/backtest.py
#     --profile    config/research/candidate.strategy.yaml
#     --indicators config/research/candidate.indicators.yaml
#
# NOT FROZEN. The out-of-sample window has not been spent, so this has not had
# its final test. scripts/freeze.py is a separate, deliberate act.
#
# The VALIDATION window was spent on 2026-09-13 (docs/strategy.md 2.5). Nothing
# here was changed afterwards, and nothing here may be: a parameter tuned to a
# window is no longer tested by it.
#
# HOW WELL EACH PARAMETER IS ACTUALLY SUPPORTED
#
#   trend_filter        STRONG   monotone, and the single largest effect found:
#     (on/off)                   without it the research window returns -2.74%
#                                CAGR at 98.4% drawdown; with it, +9.5% at 58.2%.
#   trend_filter        NONE     the threshold VALUE is a different question from
#     .threshold = -0.02         the filter's existence, and sensitivity calls it
#                                a SPIKE (neighbour gap +34.4%). Switching the
#                                leverage off below the 200dma is decisive;
#                                whether the line sits at -2% or 0% is noise.
#   regime.count = 7    OPERATOR chosen by the operator, and re-measured against
#                                the final configuration: 3 +6.30%, 5 +7.74%,
#                                7 +9.81%, 9 +7.61% CAGR.
#   max_leverage_below  OPERATOR 0.5x. Measured, then decided on principle: the
#                       = 0.5x     strategy de-levers in a downtrend but is never
#                                out of the market. See docs/strategy.md 2.5.
#   score.weights       MEDIUM   trend-heavy won; fear-heavy came last, which is
#                                consistent with the trend-filter finding.
#   transition.hyst=5   WEAK     a clean interior optimum on the marginal, best
#                                on CAGR and MDD simultaneously.
#   transition c=1,d=75 NONE     noise. The marginal for minimum_duration is
#                                non-monotone (45 +0.024, 60 -0.002, 75 +0.052,
#                                90 -0.003) and sensitivity calls d a SPIKE
#                                (neighbour gap +90%). Chosen structurally:
#                                turnover falls monotonically with duration, so
#                                the longer end is preferred for robustness.
#   indicator norm      STRUCT   RSI on its definitional 0-100 scale, everything
#                                else left on the 504-day rolling percentile. The
#                                objective ranked this 9th; it was taken over the
#                                winner because the winner stopped recognising
#                                the 2008 bottom. See docs/strategy.md 2.6.
#   regime.boundaries   STRUCT   not fitted. The highest-scoring 7-stage cut set
#                                (+11.27%) was rejected because it scored by
#                                never entering Capitulation at all. Cuts were
#                                moved one step at a time to find a plateau
#                                instead of a peak: every lower cut from 9 to 14
#                                gives an identical backtest, and stage 7 empties
#                                at 88. The middle of that plateau was taken.
#
# Over one 16.6-year window, candidate objectives span -0.10..+0.31 while
# neighbourhood means span only +0.04..+0.09. Peak height is roughly ten times
# the real signal, so the peaks are mostly luck. Where that was the case the
# value was set on structural grounds, not by taking the maximum.

version: 1
strategy_version: v0.4-searched
parameter_status: RESEARCH
data_version: fdr+reconstructed-1996
parameter_version: p1-coordinate-descent-2026-09-12
frozen_at: null
score:
  weights:
    rsi_14: 0.05555555555555555
    rsi_30: 0.05555555555555555
    price_vs_20dma: 0.06666666666666667
    price_vs_50dma: 0.06666666666666667
    price_vs_200dma: 0.06666666666666667
    ma_50_200_ratio: 0.06666666666666667
    ma_200_slope: 0.06666666666666667
    momentum_1m: 0.05555555555555555
    momentum_3m: 0.05555555555555555
    momentum_6m: 0.05555555555555555
    momentum_12m: 0.05555555555555555
    drawdown_current: 0.027777777777777776
    drawdown_30d: 0.027777777777777776
    drawdown_90d: 0.027777777777777776
    drawdown_52w: 0.027777777777777776
    vix_level: 0.037037037037037035
    vix_change_5d: 0.037037037037037035
    vix_percentile: 0.037037037037037035
    cnn_fear_greed: 0.05555555555555555
    aaii_bull_bear_spread: 0.05555555555555555
regime:
  count: 7
  labels:
  - Capitulation
  - Panic
  - Fear
  - Neutral
  - Optimism
  - Greed
  - Euphoria
  # The two end stages carry the extreme books (3.00x and 0.50x), so they are
  # reserved for extreme states. Interior cuts are symmetric about 50
  # (+-8, +-23). The outer cuts are not, deliberately: the composite score is
  # skewed (1st percentile 3.4, 99th 89.2), so symmetric cuts would make
  # Euphoria far rarer than Capitulation. 12 and 85 equalise what actually
  # matters - both ends appear on 3.7% / 3.6% of days, two episodes each over
  # 16.6 years. Robust rather than fitted: every lower cut from 9 to 14 gives
  # an identical backtest, and the upper cut has room before 88, where stage 7
  # empties entirely.
  boundaries:
  - 12.0
  - 27.0
  - 42.0
  - 58.0
  - 73.0
  - 85.0
  research_candidates:
  - 3
  - 5
  - 7
  - 9
transition:
  confirmation_days: 1
  hysteresis: 5.0
  minimum_duration_days: 75
  research_candidates:
    confirmation_days:
    - 1
    - 2
    - 3
    - 5
    - 10
    hysteresis:
    - 0
    - 2
    - 5
    - 8
    - 10
    minimum_duration_days:
    - 1
    - 5
    - 10
    - 20
    - 30
    - 45
    - 60
allocation:
  mappings:
    Capitulation:  # 3.0000x
      TQQQ: 1.0
    Panic:  # 2.5833x
      TQQQ: 0.5833333333
      QLD: 0.4166666667
    Fear:  # 2.1667x
      TQQQ: 0.1666666667
      QLD: 0.8333333333
    Neutral:  # 1.7500x
      QLD: 0.75
      QQQ: 0.25
    Optimism:  # 1.3333x
      QLD: 0.3333333333
      QQQ: 0.6666666667
    Greed:  # 0.9167x
      QQQ: 0.9166666667
      CASH: 0.0833333333
    Euphoria:  # 0.5000x
      QQQ: 0.5
      CASH: 0.5
  constraints:
    weights_non_negative: true
    weights_sum_to_one: true
    min_market_exposure: 0.5
    max_target_leverage: 3.0
tqqq_gate:
  enabled: true
  required_rules:
  - deep_drawdown
  - extreme_fear
  min_confirmations: 4
  candidate_rules:
  - deep_drawdown
  - extreme_fear
  - high_vix
  - oversold_rsi
  - volatility_spike
  - price_stabilization
  - reversal_evidence
  - breadth_capitulation
  rule_params:
    deep_drawdown:
      indicator: drawdown_52w
      min_value: 0.35
    extreme_fear:
      indicator: vix_percentile
      min_value: 0.85
    high_vix:
      indicator: vix_level
      min_value: 30.0
    oversold_rsi:
      indicator: rsi_14
      max_value: 32.0
    volatility_spike:
      indicator: vix_change_5d
      min_value: 0.2
    price_stabilization:
      indicator: drawdown_30d
      max_value: 0.08
    reversal_evidence:
      indicator: momentum_1m
      min_value: 0.0
    breadth_capitulation:
      indicator: breadth_pct_above_200dma
      max_value: 0.15
trend_filter:
  enabled: true
  indicator: price_vs_200dma
  threshold: -0.02
  # Re-entry sits a band above the exit, so the line has to be crossed rather
  # than brushed. Chosen structurally, not by peak: price_vs_200dma has a
  # 20-day standard deviation of 2.14% over the research window, so +2% (a 4%p
  # band) is roughly twice its own short-run noise. Without a band the filter
  # engaged 51 times over 16.6 years, a median spell lasting 3 days and 86% of
  # them under a month; with it, 20 spells, median 33 days, half under a month.
  reentry_threshold: 0.02
  # 0.5x is QQQ 50% + cash 50%: the leverage is switched off, but the strategy
  # is never out of the market. A full exit (0.0x) earned more over this window
  # (+9.16% vs +8.00%) at a shallower drawdown (52.1% vs 67.4%), but that window
  # holds both of the index's worst declines, which is exactly when going to
  # cash pays; and it would have demanded sitting in cash on 30% of all days.
  # 1.0x was measured too and is not a real option: +5.45% at 84.9% drawdown is
  # QQQ buy-and-hold (+5.30% / 83.0%), so the strategy would earn nothing.
  max_leverage_below: 0.5
  research_candidates:
    threshold:
    - -0.08
    - -0.05
    - -0.02
    - 0.0
    - 0.02
    max_leverage_below:
    - 0.0
    - 0.25
    - 0.5
    - 1.0
    - 1.5
    reentry_band:
    - 0.0
    - 0.02
    - 0.04
    - 0.06
execution:
  timing: NEXT_OPEN
  same_day_execution_allowed: false
  rebalance_on: regime_change
cost_model:
  commission_bps: 10.0
  spread_bps: 0.0
  slippage_bps: 0.0
dataset_split:
  research_start: '1999-01-01'
  research_end: '2015-08-14'
  validation_start: '2015-08-15'
  validation_end: '2021-02-26'
  oos_start: '2021-02-27'
  oos_end: '2026-09-11'
