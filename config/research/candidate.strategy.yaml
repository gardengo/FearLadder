# candidate.strategy.yaml — the operator's decisions, plus what research must fill.
#
# This is NOT a frozen strategy. It records the choices the operator has made
# and leaves everything else to Phase 8–9. `scripts/freeze.py` refuses it until
# every `null` below is resolved.
#
# DECIDED BY THE OPERATOR (2026-09-12)
#   - dataset split 6 : 2 : 2
#   - the allocation ladder's two endpoints
#   - TQQQ reaches 100% at financial-crisis-scale declines
#   - transaction cost 0.1% per side
#
# STILL OPEN — must come from the search, not from a preference
#   - score.weights
#   - regime.count and regime.boundaries
#   - transition.*
#   - normalization windows (config/research/*.indicators.yaml)
#   - the exact TQQQ gate thresholds

version: 1
strategy_version: v0.3-candidate
parameter_status: RESEARCH
data_version: "fdr+reconstructed-1996"
parameter_version: null
frozen_at: null

# ---------------------------------------------------------------------------
# OPEN — placeholder values so the candidate is runnable. Do not read these as
# decisions; they are equal weights and evenly-spaced cuts, which is what
# "undecided" looks like when the code still has to execute.
# ---------------------------------------------------------------------------
score:
  weights:
    rsi_14: 0.05
    rsi_30: 0.05
    price_vs_20dma: 0.05
    price_vs_50dma: 0.05
    price_vs_200dma: 0.05
    ma_50_200_ratio: 0.05
    ma_200_slope: 0.05
    momentum_1m: 0.05
    momentum_3m: 0.05
    momentum_6m: 0.05
    momentum_12m: 0.05
    drawdown_current: 0.05
    drawdown_30d: 0.05
    drawdown_90d: 0.05
    drawdown_52w: 0.05
    vix_level: 0.05
    vix_change_5d: 0.05
    vix_percentile: 0.05
    cnn_fear_greed: 0.05
    aaii_bull_bear_spread: 0.05

regime:
  count: 5
  labels: ["Capitulation", "Fear", "Neutral", "Bull", "Overheated"]
  boundaries: [20.0, 40.0, 60.0, 80.0]
  research_candidates: [3, 5, 7, 9]

transition:
  confirmation_days: 2
  hysteresis: 5.0
  minimum_duration_days: 5
  research_candidates:
    confirmation_days: [1, 2, 3, 5, 10]
    hysteresis: [0, 2, 5, 8, 10]
    minimum_duration_days: [1, 5, 10, 20]

# ---------------------------------------------------------------------------
# DECIDED — the allocation ladder
#
# The operator set the two ends and asked for the stages between to be filled:
#   most fearful  = TQQQ 100%            (3.00x)  "dot-com / financial crisis"
#   most greedy   = QQQ 50% + Cash 50%   (0.50x)  "peak mania"
#
# Generated by regime_monitor.research.ladder: leverage runs linearly between
# the two ends, and each level maps to the unique adjacent-sleeve portfolio.
# Regenerate after any change to regime.count.
#
#   Capitulation 3.00x   Fear 2.38x   Neutral 1.75x   Bull 1.12x   Overheated 0.50x
# ---------------------------------------------------------------------------
allocation:
  mappings:
    Capitulation: { QQQ: 0.0, QLD: 0.0, TQQQ: 1.0, CASH: 0.0 }
    Fear: { QQQ: 0.0, QLD: 0.625, TQQQ: 0.375, CASH: 0.0 }
    Neutral: { QQQ: 0.25, QLD: 0.75, TQQQ: 0.0, CASH: 0.0 }
    Bull: { QQQ: 0.875, QLD: 0.125, TQQQ: 0.0, CASH: 0.0 }
    Overheated: { QQQ: 0.5, QLD: 0.0, TQQQ: 0.0, CASH: 0.5 }
  constraints:
    weights_non_negative: true
    weights_sum_to_one: true
    # The greedy end keeps half the book in the market (PRD.md §2.1).
    min_market_exposure: 0.5
    max_target_leverage: 3.0

# ---------------------------------------------------------------------------
# DECIDED (direction) — the TQQQ gate
#
# The operator's requirement: TQQQ should reach 100% at financial-crisis-scale
# declines, with QQQ −70% explicitly in scope.
#
# For reference, the peak-to-trough QQQ drawdowns those periods actually
# produced: dot-com −83.0%, financial crisis −53.6%, COVID −28.6%, 2022 −35.2%.
# `deep_drawdown.min_value: 0.35` therefore admits the two crises and 2022 while
# excluding ordinary corrections.
#
# The other thresholds are starting points for TASK-083, not decisions.
# ---------------------------------------------------------------------------
tqqq_gate:
  enabled: true
  required_rules: ["deep_drawdown", "extreme_fear"]
  min_confirmations: 4
  candidate_rules:
    - deep_drawdown
    - extreme_fear
    - high_vix
    - oversold_rsi
    - volatility_spike
    - price_stabilization
    - reversal_evidence
    - breadth_capitulation
  rule_params:
    deep_drawdown: { indicator: drawdown_52w, min_value: 0.35 }
    extreme_fear: { indicator: vix_percentile, min_value: 0.85 }
    high_vix: { indicator: vix_level, min_value: 30.0 }
    oversold_rsi: { indicator: rsi_14, max_value: 32.0 }
    volatility_spike: { indicator: vix_change_5d, min_value: 0.20 }
    price_stabilization: { indicator: drawdown_30d, max_value: 0.08 }
    reversal_evidence: { indicator: momentum_1m, min_value: 0.0 }
    # breadth_pct_above_200dma is disabled, so this rule can never confirm.
    breadth_capitulation: { indicator: breadth_pct_above_200dma, max_value: 0.15 }

# ---------------------------------------------------------------------------
# DECIDED (structure) — the trend filter
#
# A fear-only ladder is ruinous over a long decline: measured on 1999-2015 the
# candidate reached capitulation six months into the dot-com crash and levered
# up while the market halved twice, finishing at -96.9% against QQQ's -77.2%.
# Fear is not the bottom, and a fear score cannot tell the difference.
#
# So leverage above the cap is available only while the long-term trend holds.
# The operator decided the rule; the indicator, the level and the cap are
# starting points for TASK-083.
# ---------------------------------------------------------------------------
trend_filter:
  enabled: true
  indicator: price_vs_200dma
  threshold: 0.0 # price at or above its 200-day average
  max_leverage_below: 1.0
  research_candidates:
    threshold: [-0.05, -0.02, 0.0, 0.02]
    max_leverage_below: [0.5, 1.0, 1.5]

execution:
  timing: NEXT_OPEN
  same_day_execution_allowed: false
  rebalance_on: regime_change

# ---------------------------------------------------------------------------
# DECIDED — transaction cost
#
# The operator specified 0.1% per side. Turnover is measured as the sum of
# absolute weight changes across the risky sleeves, which already counts the
# sell leg and the buy leg separately, so 10 bps here *is* 0.1% per side.
# Modelled as a single all-in figure because that is how it was specified.
# ---------------------------------------------------------------------------
cost_model:
  commission_bps: 10.0
  spread_bps: 0.0
  slippage_bps: 0.0

# ---------------------------------------------------------------------------
# DECIDED — dataset split, 6 : 2 : 2
#
# Starts 1999-01-01: prices reach back to 1996-01-02 via reconstruction, and the
# first three years are consumed by indicator warm-up.
#
#   research    1999-01-01 .. 2015-08-14  (16.6y)  dot-com, financial crisis
#   validation  2015-08-15 .. 2021-02-26  ( 5.5y)  2018 Q4, COVID
#   oos         2021-02-27 .. 2026-09-11  ( 5.5y)  2022 bear market
#
# Declared before any optimisation ran. SplitGuard refuses to let a search read
# validation or oos (BACKTEST_SPEC.md §20).
# ---------------------------------------------------------------------------
dataset_split:
  research_start: "1999-01-01"
  research_end: "2015-08-14"
  validation_start: "2015-08-15"
  validation_end: "2021-02-26"
  oos_start: "2021-02-27"
  oos_end: "2026-09-11"
