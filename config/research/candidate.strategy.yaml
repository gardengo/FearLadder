      min_value: 0.35
    extreme_fear:
      indicator: vix_percentile
      min_value: 0.85
    high_vix:
      indicator: vix_level
      min_value: 30.0
    oversold_rsi:
      indicator: rsi_14
      max_value: 32.0
    volatility_spike:
      indicator: vix_change_5d
      min_value: 0.2
    price_stabilization:
      indicator: drawdown_30d
      max_value: 0.08
    reversal_evidence:
      indicator: momentum_1m
      min_value: 0.0
    breadth_capitulation:
      indicator: breadth_pct_above_200dma
      max_value: 0.15
trend_filter:
  enabled: true
  indicator: price_vs_200dma
  threshold: -0.02
  max_leverage_below: 0.0
  research_candidates:
