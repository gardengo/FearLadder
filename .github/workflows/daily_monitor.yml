name: daily-monitor

# TASK-131, TASK-132, TASK-133 — the operational daily worker.
#
# Timing: the binding constraint is not the 16:00 America/New_York close, it is
# when the price feed publishes that close. The schedule used to be 22:30 UTC —
# comfortably after the close in either offset — and on 2026-09-14 that was
# still too early: at 00:45 UTC the FinanceDataReader US equity feed had VIX and
# CNN for the 14th but no QQQ bar yet. QQQ carries 77.8% of the composite
# weight against a 60% minimum coverage, so the day scored nothing and the run
# published the 11th as if it were current. The same bar was present by 05:15
# UTC.
#
# So the run happens the *morning after* each trading day. Days 2-6 (Tue-Sat
# UTC) are the mornings that follow Mon-Fri in New York.
#
# TASK-189 — why there are four schedules and not one. A single `0 6 * * 2-6`
# never started at 06:00: across its 45 runs from 2026-09-15 to 2026-11-14
# GitHub started it 3.9 to 8.4 hours late (09:56-14:23 UTC, 5.7 hours on
# average), and on 2026-11-12 it finished at 14:24 UTC, five minutes before the
# US open that the signal is meant to be acted on. The
# delay is GitHub's and cannot be configured, so the workflow is offered
# several times, off the hour, and the first attempt that finds the day
# complete does the work. The "Is there anything to do?" step is what keeps
# four schedules from meaning four runs: see src/fear_ladder/pipeline/gate.py.
#
# Nothing earlier than 00:00 UTC is worth scheduling. The price feed is asked
# for bars up to today's date and returns those that began before 00:00 UTC of
# it, so a run on the same UTC date as the session cannot see that session.
#
# The last schedule is the one that runs no matter what the feeds carry. On a
# market holiday it is the only one that does anything: the pipeline finds no
# new data, reports the last trading day it already has, and commits a
# database that differs only by the run it logged.
#
# TASK-195 — the schedules GitHub keeps are the fallback. On 2026-11-17 the
# four of them started 7.9 to 9.3 hours late. A `workflow_dispatch` starts when
# it is asked to, so an external cron service (cron-job.org) dispatches the
# workflow through the REST API with `attempt: scheduled` (and `attempt: last`
# for its final call of the day). Those dispatches go through the same gate as
# the schedules; a person's dispatch keeps the default `attempt: manual`, which
# always runs. Whichever attempt finds the day first does the work, and every
# later one, external or GitHub's, stands down. See docs/operations.md §1.

on:
  schedule:
    - cron: "17 1 * * 2-6"
    - cron: "17 3 * * 2-6"
    - cron: "17 5 * * 2-6"
    - cron: "17 8 * * 2-6" # the last attempt: keep in step with LAST_ATTEMPT_CRON
  workflow_dispatch:
    inputs:
      date:
        description: "Run as of this date (YYYY-MM-DD). Safe to repeat: idempotent."
        required: false
        type: string
      dry_run:
        description: "Compute and persist, but send no notifications"
        required: false
        type: boolean
        default: false
      profile:
        description: "Strategy profile"
        required: false
        type: choice
        options: [operational, placeholder]
        default: operational
      attempt:
        description: "manual: always run. scheduled / last: an external scheduler's attempt, gated like the schedules below"
        required: false
        type: choice
        options: [manual, scheduled, last]
        default: manual

# Never let two runs write the same SQLite file at once.
concurrency:
  group: daily-monitor
  cancel-in-progress: false

permissions:
  contents: write # TASK-132 commits the updated database back

env:
  PYTHONUTF8: "1"
  # github.event.schedule carries the cron string that fired, which is the only
  # way a run can tell which of the schedules above it is.
  LAST_ATTEMPT_CRON: "17 8 * * 2-6"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Read-only, and before anything that takes time. An attempt that stands
      # down must leave the database exactly as it found it, or it would be
      # committed. Every step below is conditioned on this one; the condition
      # is `!= 'false'` rather than `== 'true'` so that a gate which wrote
      # nothing at all cannot be the reason the market went unmonitored.
      - name: Is there anything to do?
        id: gate
        continue-on-error: true
        # A dispatch that names no attempt is a person's, and runs.
        run: |
          python scripts/batch_gate.py \
            ${{ github.event_name == 'workflow_dispatch' && (inputs.attempt || 'manual') == 'manual' && '--manual' || '' }} \
            ${{ (github.event.schedule == env.LAST_ATTEMPT_CRON || (github.event_name == 'workflow_dispatch' && inputs.attempt == 'last')) && '--last-attempt' || '' }}

      - name: Stand down
        if: steps.gate.outputs.run == 'false'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: echo "::notice title=Nothing to do::$REASON"

      - name: Preflight — is the strategy frozen?
        id: preflight
        if: steps.gate.outputs.run != 'false'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from fear_ladder.config.loader import load_config
          config = load_config()
          unresolved = config.unresolved_parameters()
          ready = config.is_production_ready
          print(f"ready={'true' if ready else 'false'}")
          print(f"version={config.strategy.strategy_version}")
          print(f"status={config.strategy.parameter_status.value}")
          print(f"unresolved={len(unresolved)}")
          PY

      # Until 2026-09-13 an unfrozen strategy was the normal state and this step
      # merely said so. The strategy is frozen now (v1.0-frozen), so the same
      # condition means config/strategy.yaml was overwritten or the checkout is
      # wrong — and operating on it would emit a signal nobody researched.
      - name: Refuse to run on an unfrozen strategy
        if: >-
          steps.gate.outputs.run != 'false' &&
          steps.preflight.outputs.ready != 'true' &&
          inputs.profile != 'placeholder'
        run: |
          echo "::error title=Strategy is not frozen::\
          ${{ steps.preflight.outputs.version }} is \
          ${{ steps.preflight.outputs.status }} with \
          ${{ steps.preflight.outputs.unresolved }} unresolved parameters. \
          config/strategy.yaml should be v1.0-frozen, and the manifest under \
          config/frozen/ is the evidence for it. Restore it from git rather \
          than filling values in by hand."
          exit 1

      # The name is the scope. This gate exists to refuse to publish a signal
      # computed by broken code — so it runs the operational path and nothing
      # else. Dashboard tests are deselected: the dashboard imports no compute
      # module (ARCHITECTURE.md §18, §4.2), so it cannot tell you whether the
      # pipeline is safe to run, and on 2026-09-16 a dashboard test did stop
      # the market from being monitored for three days. `test.yml` runs the
      # full suite, dashboard included, on every push and pull request.
      #
      # `-m` deselects *after* collection, so the marker alone is not enough:
      # a dashboard module must also survive being imported without the
      # `dashboard` extra. `pytest.importorskip` in those modules does that.
      - name: Run the tests that guard the pipeline
        if: steps.gate.outputs.run != 'false'
        run: |
          pip install -e ".[dev]"
          pytest -m "not network and not dashboard" -q

      # CNN's long history and the AAII survey have no API worth depending on,
      # so they arrive as files. They are not committed — they are third-party
      # inputs, not results of this project — which means a fresh runner starts
      # without them and has to fetch them each time.
      - name: Refresh the reference datasets
        id: reference
        if: steps.gate.outputs.run != 'false'
        continue-on-error: true
        run: python scripts/fetch_reference.py

      # AAII is optional, so a failed fetch degrades the score rather than
      # stopping the run: its weight is redistributed across the indicators that
      # did read. That is a quieter outcome than a crash and therefore the one
      # worth announcing — the live signal stops matching the backtested one.
      - name: Say so when a reference dataset is missing
        if: steps.gate.outputs.run != 'false' && steps.reference.outcome != 'success'
        run: |
          echo "::warning title=Reference data not refreshed::\
          scripts/fetch_reference.py failed, so AAII sentiment (5.6% of the \
          composite score) may be stale or absent. The run continues with its \
          weight redistributed, which means today's signal is not the one that \
          was backtested. See data/reference/README.md."

      - name: Daily run
        id: run
        if: steps.gate.outputs.run != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The placeholder profile is for manual testing only, and opening the
          # research gate is what makes that possible. The scheduled path never
          # takes this branch.
          FEAR_LADDER_ALLOW_RESEARCH_PARAMS: ${{ inputs.profile == 'placeholder' && '1' || '' }}
        run: |
          python scripts/daily_runner.py \
            --profile "${{ inputs.profile || 'operational' }}" \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee run.log
          echo "summary=$(tail -n 1 run.log)" >> "$GITHUB_OUTPUT"

      - name: Verify the database is still readable
        # TASK-132: never push a database the next run could not open. This is
        # the last point at which a corrupt file can be caught cheaply.
        if: steps.run.outcome == 'success'
        run: |
          python - <<'PY'
          from fear_ladder.data.repositories.connection import connect
          from fear_ladder.data.repositories.sqlite import SQLiteUnitOfWork

          connection = connect(read_only=True)
          integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit(f"integrity check failed: {integrity}")
          connection.close()

          with SQLiteUnitOfWork() as uow:
              state = uow.states.get_latest_state()
              print(f"latest state: {state.observation_date} {state.regime}" if state
                    else "no state recorded yet")
          PY

      # The whole database is re-committed every trading day and SQLite does not
      # delta-compress, so without a bound the repository grows by the size of
      # the file daily. The script refuses a window shorter than the indicators'
      # longest lookback, so this cannot quietly degrade tomorrow's signal.
      - name: Prune raw observations to the retention window
        if: steps.run.outcome == 'success' && inputs.dry_run != true
        run: python scripts/prune_observations.py --keep-years 5

      - name: Commit the updated database
        if: steps.run.outcome == 'success' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fear_ladder.db
          if git diff --cached --quiet; then
            echo "::notice::database unchanged (likely a non-trading day); nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): daily state ${{ steps.run.outputs.summary }}

          Automated by .github/workflows/daily_monitor.yml
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Another run may have pushed while this one was working.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push

      - name: Publish the run log
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: daily-run-${{ github.run_id }}
          path: run.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Report a failure loudly
        # TASK-131 requires failure visibility. A monitoring system that stops
        # monitoring silently is the failure mode worth the most noise.
        if: failure()
        run: |
          echo "::error title=Daily monitor failed::\
          The run did not complete, so no state was committed. \
          Check the log above, then re-run this workflow manually: it is \
          idempotent, so re-running the same date is safe."
